  if (!sameQuestion) {
  act.innerHTML = '';
  if (wait) {
    const style = { fold: 'danger', check: '', call: '', bet: 'primary', raise: 'primary' };
    const LABEL = { fold: 'Fold', check: 'Check', call: 'Call', bet: 'Bet', raise: 'Raise' };
    // The raise button shows the amount that will actually be played, not a range.
    // "Raise 2–106" looked like a bug and, worse, said nothing about what a press
    // would do; the ceiling is not the 100bb stack but the stack plus chips already in.
    act.innerHTML = wait.options.map((o) => o.min !== undefined && o.min !== null
      ? `<button class="${style[o.action]}" data-a="${o.action}" data-min="${o.min}" data-max="${o.max}">${LABEL[o.action]} to <span data-amt-label>${bbs(o.min)}</span></button>`
      : `<button class="${style[o.action]}" data-a="${o.action}" data-amt="${o.amount || 0}">${LABEL[o.action]}${o.amount ? ' ' + bbs(o.amount) : ''}</button>`).join('')
      ;
    const raise = wait.options.find((o) => o.min != null);
    if (raise) {
      // Pot-based sizing: what my TOTAL for the street should come to.
      const myBet = ((s.live && s.live.seats) || [])
        .filter((p) => p.name === s.viewer).map((p) => p.bet)[0] || 0;
      const potAfterCall = (wait.pot || 0) + (wait.to_call || 0);
      // Rounded to a whole chip, or the slider (which steps in chips) drifts out of
      // step with the field, which is in bb.
      const target = (frac) => Math.min(raise.max, Math.max(raise.min,
        Math.round(myBet + (wait.to_call || 0) + frac * potAfterCall)));
      const quick = [['½ pot', 0.5], ['¾ pot', 0.75], ['pot', 1]]
        .map(([label, frac]) => `<button data-set="${target(frac)}">${label}</button>`).join('')
        + `<button data-set="${raise.max}">all-in</button>`;
      // Steppers of 0.5 bb — as fine as the slider and the field.
      // On mobile a slider is miserable to hit, and typing into the field means
      // summoning a keyboard over half the screen; by thumb this is the only way.
      act.innerHTML += `<div class="raisebar">
        <input id="t-slider" type="range" min="${raise.min}" max="${raise.max}"
               step="${bigBlind / 2}" value="${raise.min}">
        <button class="step" data-step="-1" aria-label="half a blind less">−</button>
        <input id="t-amt" type="number" step="${bigBlind / chipScale / 2}"
               inputmode="decimal"
               style="width:78px" value="${bbs(raise.min)}"><span class="unit">${unitLabel()}</span>
        <button class="step" data-step="1" aria-label="half a blind more">+</button>
        ${quick}</div>`;
      const slider = $('t-slider'), field = $('t-amt');
      // The button label has to follow the amount — from here on the bar does not
      // redraw itself until a new question arrives.
      const label = act.querySelector('[data-amt-label]');
      const sync = (chips) => {
        const clamped = Math.min(raise.max, Math.max(raise.min, Math.round(chips)));
        slider.value = clamped;
        field.value = bbs(clamped);
        if (label) label.textContent = bbs(clamped);
      };
      // The slider is in chips, the field in bb — they are kept in step.
      slider.oninput = () => sync(+slider.value);
      // While typing the value is not clamped, or the "1" of "12" would jump
      // straight to the minimum and the second digit could never be typed.
      field.oninput = () => {
        const chips = (+field.value || 0) * chipScale;
        slider.value = Math.round(chips);
        if (label) label.textContent = field.value || bbs(raise.min);
      };
      field.onchange = () => sync((+field.value || 0) * chipScale);
      act.querySelectorAll('[data-set]').forEach((b) => {
        b.onclick = (e) => { e.stopPropagation(); sync(+b.dataset.set); };
      });
      // The step is computed from the field, not the slider: while typing the
      // slider stays unrounded and the value would jump on the next press.
      act.querySelectorAll('[data-step]').forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          const now = (+field.value || 0) * chipScale;
          sync(now + (+b.dataset.step) * (bigBlind / 2));
        };
      });
    }
    act.querySelectorAll('button[data-a]').forEach((b) => {
      b.onclick = async () => {
        // The field is in bb, the server wants chips. Clamping to the legal range
        // happens here too, so what is sent matches what the button said.
        const typed = +(($('t-amt') || {}).value || 0);
        const amount = b.dataset.min !== undefined
          ? Math.min(+b.dataset.max, Math.max(+b.dataset.min,
              Math.round(typed ? typed * chipScale : +b.dataset.min)))
          : (+b.dataset.amt || 0);
        b.disabled = true;
        const res = await fetch('/api/table/act', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: b.dataset.a, amount, token: seatToken }),
        });
        if (!res.ok) {
          // A rejected action has to be put back in play. The bar redraws only on a
          // NEW question, so without this the buttons would stay greyed out and the
          // table would wait for an action that cannot be entered.
          b.disabled = false;
          const why = await res.text();
          $('t-status').textContent = 'the action was rejected: ' + why;
          return;
        }
        tableState();
      };
    });
  }
  }
  const turn = s.waiting_for && !s.waiting_for.mine ? ` · ${s.waiting_for.seat} is thinking` : '';
  // Does the bot read the game's history? It is an input to the prompt, so it
  // has to be visible — the same line-up with empty profiles plays differently.
  const ex = s.exploits;
  const exploits = ex
    ? ` · reads: ${ex.players} profiles`
      + (ex.from_history ? ` (${ex.from_history} hands from earlier sessions)` : ' (bez historie)')
    : '';
  $('t-status').textContent = `${s.hands_played}/${s.hands_target} hands · `
    + `spent $${fmt(s.cost_usd, 4)}${turn}${exploits}`
    + (s.paused ? ' · na pauze' : '')
    + (s.viewer ? ` · you are ${s.viewer}` : '');
  // "Your turn" belongs above the buttons, not only on the seat down on the
  // table: on a phone the action bar is pinned low and the table is scrolled away.
  $('t-status').classList.toggle('my-turn', !!wait);
  if (wait) $('t-status').textContent = 'JSI NA TAHU · ' + $('t-status').textContent;
  $('t-run').textContent = s.label ? 'game: ' + s.label : '';
  if (s.live && s.live.finished) {
    $('t-status').textContent += ' · click a bot to see how it decided';
  }
  // A spectator at a table with human seats has to see that they are missing a
  // link, rather than silently getting no buttons.
  const humans = (s.seats || []).filter((p) => p.kind === 'human').map((p) => p.name);
  $('t-seatwarn').classList.toggle('hidden', !(s.running && !s.viewer && humans.length));
  if (s.running && !s.viewer && humans.length) {
    $('t-seatwarn').innerHTML = `You are watching, not playing — the people at this table are `
      + `${humans.join(' a ')}. Open your own link from `
      + `<b>Links for the other players</b> (or scan the QR code).`;
  }
  // With no table running it only slows down. It must not stop: a friend with
  // the link open would never see a new game and would have to hit refresh.
  startPolling(s.running ? 1200 : 4000);
}

  $('t-handlog').innerHTML = '';

$('t-start').onclick = async () => {
  clearTableView();
  const res = await fetch('/api/table', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ config: collectConfig(), hands: +$('t-hands').value,
                           label: $('preset').value, owner: ownerToken }),
  });
  if (!res.ok) {
    const text = await res.text();
    // A missing owner token is the one error a user can fix themselves — so offer
    // them the field for it, not just a message.
    $('t-log').innerHTML = `<div class="loss">${text}</div>` + (res.status === 403
      ? `<div style="margin-top:6px">The owner token was printed by the server at startup.
           <input id="t-owner" placeholder="paste a token" style="width:150px">

$('t-stop').onclick = async () => { await fetch('/api/table/stop', { method: 'POST' }); tableState(); };

/* Full screen for playing. On mobile this is the difference between "usable"
   and "not": the header and the settings column go, and the table gets
   everything. The native fullscreen API is tried, but iOS Safari does not have
   it on an ordinary element — so the state is also held in a class on `body`,
   which works everywhere. */
async function setFullscreen(on) {
  document.body.classList.toggle('fullscreen', on);
  syncAppHeight();
  try {
    if (on && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if (!on && document.fullscreenElement) {
      await document.exitFullscreen();
    }
  } catch (e) { /* without native fullscreen the class alone is enough */ }
}
$('t-full').onclick = () => setFullscreen(true);
$('t-exit').onclick = () => setFullscreen(false);
document.addEventListener('fullscreenchange', () => {
  // Leaving by Esc or a gesture has to bring our own class back in line.
  if (!document.fullscreenElement && document.body.classList.contains('fullscreen')) {
    document.body.classList.remove('fullscreen');
    syncAppHeight();
  }
});

/* Table setup as a slide-over panel (on mobile; the desktop has a column). */
function toggleSide(open) {
  const on = open === undefined
    ? !document.body.classList.contains('side-open') : open;
  document.body.classList.toggle('side-open', on);
}
$('t-side').onclick = () => toggleSide();
$('side-close').onclick = () => toggleSide(false);

/* The window's real visible height. On mobile `100vh` counts the area under
   the browser bars too, so the table "does not fit" when it should; `dvh` needs
   a newer Safari. visualViewport gives the exact figure everywhere and
   recalculates when a bar slides out, the phone rotates, or the keyboard
   appears. */
function syncAppHeight() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  fitFelt();
}
/* On a phone the table's size is worked out by hand: it has to fit the height
   left over AND the width, and keep its shape. CSS alone cannot do it —
   `aspect-ratio` can be constrained in one direction only, and in the other the
   table overflows (and the page with it, so even the header slides). In
   landscape the table is a wide ellipse, in portrait nearly a circle; otherwise
   a strip is left at the sides that nobody uses. */
function fitFelt() {
  const felt = $('t-felt');
  const wrap = felt && felt.parentElement;
  if (!wrap) return;
  if (!document.body.classList.contains('tab-table') || window.innerWidth > 900) {
    felt.style.width = felt.style.height = '';
    return;
  }
  const availW = wrap.clientWidth, availH = wrap.clientHeight;
  if (availW < 40 || availH < 40) return;
  // The shape follows the window smoothly (from a circle to a wide ellipse), so
  // no empty strip is left around the table in either orientation.
  const ratio = Math.min(16 / 9, Math.max(1, availW / availH));
  const w = Math.min(availW, availH * ratio);
  felt.style.width = Math.floor(w) + 'px';
  felt.style.height = Math.floor(w / ratio) + 'px';
}
syncAppHeight();
/* The bottom action bar changes height with what can be played (a sizing
   slider appears). The table has to follow, or it overflows by exactly that
   much — so we observe the table's wrapper directly. No feedback loop: we
   resize the table inside it, not the wrapper. */
if (window.ResizeObserver) {
  const wrap = $('t-felt') && $('t-felt').parentElement;
  if (wrap) new ResizeObserver(() => fitFelt()).observe(wrap);
}
window.addEventListener('resize', syncAppHeight);
window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 250));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncAppHeight);
  window.visualViewport.addEventListener('scroll', syncAppHeight);
}

/* The browser bars top and bottom cannot be hidden from a page — on iOS only
   the home-screen mode can. Mentioned once; dismiss it and it stays gone. */
function maybeOfferA2HS() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem('pf-a2hs') === 'off'; } catch (e) {}
  if (standalone || dismissed || window.innerWidth > 900) return;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const box = document.createElement('div');
  box.id = 'a2hs';
  box.innerHTML = '<span></span><button>Got it</button>';
  box.firstChild.textContent = ios
    ? 'Tip: Share → "Add to Home Screen". It opens without browser chrome and the table gets the whole screen.'
    : 'Tip: browser menu → "Add to Home Screen". It opens without chrome and the table gets the whole screen.';
  box.querySelector('button').onclick = () => {
    try { localStorage.setItem('pf-a2hs', 'off'); } catch (e) {}
    box.remove();
  };
  document.body.appendChild(box);
}

/* The page is the table and nothing else. Seat links have to load here too,
   not only after "New game": after a reload at a running table they would
   otherwise vanish, and there would be nowhere to get the address for a friend
   who turned up later. */
function openTable() {
  document.body.classList.add('tab-table');
  loadPresets(); renderRuns(); showSeatLinks(); startPolling();
  syncAppHeight();
  maybeOfferA2HS();
}
/* Three steps rather than a switch: dark → dim → light. The choice survives a
   reload, or on a phone you would set it again after every load. */
const THEMES = ['dark', 'dim', 'light'];
const THEME_ICON = { dark: '◐', dim: '◑', light: '◯' };
function currentTheme() {
  const root = document.documentElement;
  return root.classList.contains('light') ? 'light'
    : root.classList.contains('dim') ? 'dim' : 'dark';
}

function applyTheme(name) {
  const t = THEMES.includes(name) ? name : 'dark';
  document.documentElement.classList.toggle('dim', t === 'dim');
  document.documentElement.classList.toggle('light', t === 'light');
  $('theme').textContent = THEME_ICON[t];
  $('theme').title = 'theme: ' + t;
  // So the browser bar / status bar matches the background and adds no strip.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = { dark: '#0e1116', dim: '#2a3038', light: '#f5f7fa' }[t];
  try { localStorage.setItem('pf-theme', t); } catch (e) { /* private mode */ }
}
$('theme').onclick = () => {
  // The state is read from the DOM, not localStorage — in private mode the save
  // would fail and the button would keep toggling the same thing forever.
  applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
};
try { applyTheme(localStorage.getItem('pf-theme') || 'dark'); } catch (e) {}

openTable();

/* `?hand=<id>&step=<n>` opens a specific spot straight away — a link to a
   moment in a hand can be passed on. The table state has to arrive first so the
   seat kinds are known; without them nobody can be clicked. */
(async () => {
  const params = new URLSearchParams(location.search);
  const handId = params.get('hand');
  if (!handId) return;
  await tableState();
  const step = params.get('step');
  reviewHand(handId, reviewViewer || lastViewer, step == null ? null : +step);
})();
</script>
</body>
</html>
